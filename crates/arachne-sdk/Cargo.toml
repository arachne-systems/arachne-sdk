[package]
name = "arachne-sdk"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Typed Rust client for Arachne's secure peer-to-peer workspaces"
repository = "https://github.com/arachne-systems/arachne-sdk"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arachne-runtime = { path = "../../core/crates/arachne-runtime" }
arachne-api = { path = "../../core/crates/arachne-api" }
# Pinned for all four generators: uniffi-bindgen-go v0.7.1 targets 0.31 (ADR A1/A4).
uniffi = "=0.31.2"
thiserror = "2.0.20"
