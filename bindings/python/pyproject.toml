[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arachne-sdk"
version = "0.1.0"
description = "Python binding for Arachne secure peer-to-peer workspaces"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["arachne_sdk*"]
