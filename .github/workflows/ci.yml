name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: ${{ matrix.os }} SDK and bindings
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup component add rustfmt --toolchain 1.98.0

      - name: Build and test Rust SDK
        run: |
          cargo +1.98.0 fmt --package arachne-sdk --check
          cargo +1.98.0 test --locked -p arachne-sdk --all-targets
          cargo +1.98.0 test --locked -p arachne-sdk --features moq --test client
          cargo +1.98.0 build --locked -p arachne-sdk

  generated-bindings:
    name: Generated bindings (UniFFI)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: 1.98.0
      JNA_VERSION: 5.17.0
      JNA_SHA256: b3a9408e7c51e08ef0e3bfcc08f443f6ec0f6191ba8cd7c18d53d2b22e5bdbc0
      KOTLIN_VERSION: 2.3.0
      KOTLIN_SHA256: ea16ab1cab29d419bf41b60ecc0e305d449fa661d9c05fbcc5b2a6672505456a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2
        with:
          swift-version: "6.1.3"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install kotlinc and JNA
        run: |
          tools="$RUNNER_TEMP/kotlin-tools"
          mkdir -p "$tools"
          curl -sfLo "$tools/kotlin.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          echo "$KOTLIN_SHA256  $tools/kotlin.zip" | sha256sum -c -
          unzip -q "$tools/kotlin.zip" -d "$tools"
          echo "$tools/kotlinc/bin" >> "$GITHUB_PATH"
          curl -sfLo "$tools/jna.jar" \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA_VERSION/jna-$JNA_VERSION.jar"
          echo "$JNA_SHA256  $tools/jna.jar" | sha256sum -c -
          echo "JNA_JAR=$tools/jna.jar" >> "$GITHUB_ENV"

      - name: Cache the patched Go generator
        id: bindgen-go
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: target/tools/bin
          key: uniffi-bindgen-go-${{ runner.os }}-${{ hashFiles('scripts/build-uniffi-bindgen-go.sh', 'patches/uniffi-bindgen-go-enum-discr.patch') }}

      - name: Build the patched Go generator
        if: steps.bindgen-go.outputs.cache-hit != 'true'
        run: scripts/build-uniffi-bindgen-go.sh

      - name: Generate bindings and check they are committed
        run: |
          scripts/generate-bindings.sh
          git diff --exit-code -- generated/
          test -z "$(git status --porcelain -- generated/)"

      - name: Smoke-test Kotlin, Swift, Python and Go
        run: scripts/uniffi-smoke.sh

  generated-android:
    name: Generated Kotlin AAR (Android, 16 KB pages)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      GRADLE_LANE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust 1.98.0 Android targets
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android --toolchain 1.98.0
          cargo +1.98.0 install cargo-ndk --locked --version 4.1.2

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 emulator"

      - name: Set Android NDK home
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # Builds the 16 KB aligned .so files (the build fails on any other
      # LOAD alignment), the AAR, and the R8-minified smoke app.
      - name: Build the AAR and the minified smoke app
        run: scripts/gradle.sh --no-daemon --max-workers=2 :sdk:publishReleasePublicationToLocalRepository :smoke:assembleRelease

      - name: Check R8 kept the UniFFI and JNA classes
        run: scripts/check-android-r8.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          ndk: 27.1.12297006
          script: scripts/gradle.sh --no-daemon --max-workers=2 :smoke:connectedDebugAndroidTest
