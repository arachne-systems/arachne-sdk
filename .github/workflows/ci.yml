name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: ${{ matrix.os }} SDK and bindings
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup component add rustfmt --toolchain 1.98.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with:
          swift-version: "6.1.3"

      - name: Build and test Rust SDK
        run: |
          cargo +1.98.0 fmt --package arachne-sdk --check
          cargo +1.98.0 test --locked -p arachne-sdk --all-targets
          cargo +1.98.0 build --locked -p arachne-sdk

      - name: Set native library paths
        shell: bash
        run: |
          native_dir="$GITHUB_WORKSPACE/target/debug"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            library="$native_dir/libarachne_sdk.dylib"
            echo "DYLD_LIBRARY_PATH=$native_dir${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          else
            library="$native_dir/libarachne_sdk.so"
            echo "LD_LIBRARY_PATH=$native_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi
          echo "ARACHNE_SDK_LIBRARY=$library" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$native_dir" >> "$GITHUB_ENV"

      - name: Test Go binding
        run: |
          test -z "$(gofmt -l bindings/go)"
          go test -count=1 ./bindings/go/...
          go vet ./bindings/go/...

      - name: Test installed Python binding
        run: |
          python -m pip install ./bindings/python
          python -m unittest discover -s bindings/python/tests -v

      - name: Test Swift package
        run: swift test

      - name: Test Kotlin binding
        run: ./gradlew --no-daemon --max-workers=2 test
        working-directory: bindings/kotlin

  kotlin-android:
    name: Kotlin Android runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust 1.98.0 Android targets
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android --toolchain 1.98.0
          cargo +1.98.0 install cargo-ndk --locked --version 4.1.2

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 emulator"

      - name: Set Android NDK home
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          ndk: 27.1.12297006
          working-directory: bindings/kotlin-android
          script: ../kotlin/gradlew --no-daemon --max-workers=2 :smoke:connectedDebugAndroidTest
