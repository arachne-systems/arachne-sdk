name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: ${{ matrix.os }} SDK and bindings
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust 1.98.0
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup component add rustfmt --toolchain 1.98.0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: swift-actions/setup-swift@v2
        if: runner.os == 'Linux'
        with:
          swift-version: "6.1.3"

      - name: Build and test Rust SDK
        run: |
          cargo +1.98.0 fmt --package arachne-sdk --check
          cargo +1.98.0 test --locked -p arachne-sdk --all-targets
          cargo +1.98.0 build --locked -p arachne-sdk

      - name: Set native library paths
        shell: bash
        run: |
          native_dir="$GITHUB_WORKSPACE/target/debug"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            library="$native_dir/libarachne_sdk.dylib"
            echo "DYLD_LIBRARY_PATH=$native_dir${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          else
            library="$native_dir/libarachne_sdk.so"
            echo "LD_LIBRARY_PATH=$native_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi
          echo "ARACHNE_SDK_LIBRARY=$library" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$native_dir" >> "$GITHUB_ENV"

      # TODO(ADR A1/A4 step 8): the hand Go/Python/Swift bindings call ops
      # that core removed (A3/B1) and are not ported. The generated bindings
      # replace them; see the `generated-bindings` job. Delete this step with
      # the hand bindings in step 8.
      - name: Test Go binding
        if: false
        run: |
          test -z "$(gofmt -l bindings/go)"
          go test -count=1 ./bindings/go/...
          go vet ./bindings/go/...

      # TODO(ADR A1/A4 step 8): the hand Go/Python/Swift bindings call ops
      # that core removed (A3/B1) and are not ported. The generated bindings
      # replace them; see the `generated-bindings` job. Delete this step with
      # the hand bindings in step 8.
      - name: Test installed Python binding
        if: false
        run: |
          python -m pip install ./bindings/python
          python -m unittest discover -s bindings/python/tests -v

      # TODO(ADR A1/A4 step 8): the hand Go/Python/Swift bindings call ops
      # that core removed (A3/B1) and are not ported. The generated bindings
      # replace them; see the `generated-bindings` job. Delete this step with
      # the hand bindings in step 8.
      - name: Test Swift package
        if: false
        run: swift test

  generated-bindings:
    name: Generated bindings (UniFFI)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: 1.98.0
      JNA_VERSION: 5.17.0
      JNA_SHA256: b3a9408e7c51e08ef0e3bfcc08f443f6ec0f6191ba8cd7c18d53d2b22e5bdbc0
      KOTLIN_VERSION: 2.3.0
      KOTLIN_SHA256: ea16ab1cab29d419bf41b60ecc0e305d449fa661d9c05fbcc5b2a6672505456a
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Rust 1.98.0
        run: rustup toolchain install 1.98.0 --profile minimal

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1.3"

      - uses: astral-sh/setup-uv@v7

      - name: Install kotlinc and JNA
        run: |
          tools="$RUNNER_TEMP/kotlin-tools"
          mkdir -p "$tools"
          curl -sfLo "$tools/kotlin.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v$KOTLIN_VERSION/kotlin-compiler-$KOTLIN_VERSION.zip"
          echo "$KOTLIN_SHA256  $tools/kotlin.zip" | sha256sum -c -
          unzip -q "$tools/kotlin.zip" -d "$tools"
          echo "$tools/kotlinc/bin" >> "$GITHUB_PATH"
          curl -sfLo "$tools/jna.jar" \
            "https://repo1.maven.org/maven2/net/java/dev/jna/jna/$JNA_VERSION/jna-$JNA_VERSION.jar"
          echo "$JNA_SHA256  $tools/jna.jar" | sha256sum -c -
          echo "JNA_JAR=$tools/jna.jar" >> "$GITHUB_ENV"

      - name: Cache the patched Go generator
        id: bindgen-go
        uses: actions/cache@v4
        with:
          path: target/tools/bin
          key: uniffi-bindgen-go-${{ runner.os }}-${{ hashFiles('scripts/build-uniffi-bindgen-go.sh', 'patches/uniffi-bindgen-go-enum-discr.patch') }}

      - name: Build the patched Go generator
        if: steps.bindgen-go.outputs.cache-hit != 'true'
        run: scripts/build-uniffi-bindgen-go.sh

      - name: Generate bindings and check they are committed
        run: |
          scripts/generate-bindings.sh
          git diff --exit-code -- generated/
          test -z "$(git status --porcelain -- generated/)"

      - name: Smoke-test Kotlin, Swift, Python and Go
        run: scripts/uniffi-smoke.sh

  generated-android:
    name: Generated Kotlin AAR (Android, 16 KB pages)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Rust 1.98.0 Android targets
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup target add aarch64-linux-android x86_64-linux-android --toolchain 1.98.0
          cargo +1.98.0 install cargo-ndk --locked --version 4.1.2

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006 emulator"

      - name: Set Android NDK home
        run: echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # Builds the 16 KB aligned .so files (the build fails on any other
      # LOAD alignment), the AAR, and the R8-minified smoke app.
      - name: Build the AAR and the minified smoke app
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :sdk:publishReleasePublicationToLocalRepository :smoke:assembleRelease

      - name: Check R8 kept the UniFFI and JNA classes
        run: scripts/check-android-r8.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_ps16k
          arch: x86_64
          ndk: 27.1.12297006
          working-directory: android
          script: ./gradlew --no-daemon --max-workers=2 :smoke:connectedDebugAndroidTest
